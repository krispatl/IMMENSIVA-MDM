<div class="operator-task-tabs" role="group" aria-label="Device actions">
  <button type="button" data-task="launch" aria-pressed="true">Open app</button>
  <button type="button" data-task="install" aria-pressed="false">Install app</button>
  <button type="button" data-task="files" aria-pressed="false">Send files</button>
  <button type="button" data-task="maintenance" aria-pressed="false">Maintenance</button>
</div>
<p class="operator-task-help" id="operatorTaskHelp">Choose an app, check your headsets, then open it.</p>
<div class="operator-app-picker" id="operatorAppPicker">
  <label for="operatorApp">App</label>
  <select id="operatorApp">
    <option value="com.fifthyang.lordlyrical.offline">Load Lyrical Offline</option>
    <option value="com.UnityTechnologies.Feu_Bleu_Proto">Feu Bleu</option>
    <option value="com.IMMENSIVA.JomonPlotPrototype">Ancient Future Under Water</option>
    <option value="com.ImanTransmedia.LineasImaginarias">Lineas Imaginarias</option>
    <option value="com.FacingWorlds.ModernFossils">Modern Fossils</option>
    <option value="com.Immersiva.RELATS">RELATS</option>
    <option value="">Another app…</option>
  </select>
  <p>Opening the app does not start the performance. Use the show launcher after alignment.</p>
</div>
<p class="operator-selection" id="operatorSelection" role="status">Select a room or headset on the left.</p>
